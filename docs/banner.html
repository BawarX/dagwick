<!doctype html>
<!-- Source of docs/banner.png. Render at 1280x640 (see CONTRIBUTING.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dagwick banner</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative; font-family: Inter, system-ui, sans-serif; color: #f6efe2;
    background:
      radial-gradient(640px 520px at 300px 300px, rgba(251, 176, 59, .26), transparent 70%),
      radial-gradient(1000px 500px at 900px 700px, rgba(251, 176, 59, .07), transparent 70%),
      linear-gradient(180deg, #121521 0%, #0c0e17 70%, #090a10 100%);
  }
  body::after { /* vignette */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 120% at 35% 45%, transparent 55%, rgba(0, 0, 0, .55) 100%);
  }
  svg.scene { position: absolute; inset: 0; }
  .text { position: absolute; left: 600px; top: 96px; width: 660px; }
  h1 {
    font: 700 128px/1.15 Fredoka, sans-serif; letter-spacing: -1px;
    padding-bottom: .14em; margin-bottom: -.2em; /* room for the g's descender: background-clip cuts at the box edge */
    background: linear-gradient(180deg, #fff6dc 0%, #fcd34d 55%, #f59e0b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 30px rgba(251, 176, 59, .35));
  }
  .tag { margin-top: 16px; font: 500 30px/1.25 Fredoka, sans-serif; color: #f3e9d6; white-space: nowrap; }
  .sub { margin-top: 12px; font-size: 20px; color: #9aa1b2; letter-spacing: .2px; }
  .sub b { color: #e7c77a; font-weight: 500; }
</style>
</head>
<body>
<svg class="scene" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7a3" stop-opacity=".85"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ea580c"/><stop offset="55%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fff1b8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a4b14"/><stop offset="40%" stop-color="#f0b452"/><stop offset="60%" stop-color="#d99a3a"/><stop offset="100%" stop-color="#7a4b14"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff3d6" stop-opacity=".42"/><stop offset="35%" stop-color="#fff3d6" stop-opacity=".1"/><stop offset="100%" stop-color="#fff3d6" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="1180" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity=".9"/><stop offset="100%" stop-color="#fbbf24" stop-opacity=".25"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- light pool on the "floor" -->
  <ellipse cx="560" cy="560" rx="560" ry="70" fill="url(#pool)"/>

  <!-- rope -->
  <path d="M300 0 L293 116" stroke="#5b3a14" stroke-width="4" stroke-linecap="round"/>
  <path d="M300 0 L293 116" stroke="#a87531" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- the lantern, scaled up (lantern art uses a 160x160 box) -->
  <g transform="translate(300 300) rotate(-4) translate(-210 -228) scale(2.625)">
    <circle cx="80" cy="88" r="78" fill="url(#glow)"/>
    <g fill="#fff1b8">
      <path d="M134 50 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
      <path d="M22 70 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z"/>
      <path d="M140 104 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2z"/>
    </g>
    <path d="M56 50 C 56 16, 104 16, 104 50" fill="none" stroke="#7a4b14" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="24" r="5" fill="none" stroke="#7a4b14" stroke-width="3.5"/>
    <path d="M62 44 L98 44 L110 58 L50 58 Z" fill="url(#metal)"/>
    <rect x="70" y="38" width="20" height="7" rx="2" fill="#7a4b14"/>
    <g filter="url(#soft)" opacity=".8"><path d="M80 108 C 64 98, 69 80, 80 64 C 83 77, 96 85, 91 98 C 89 104, 85 107, 80 108 Z" fill="#fbbf24"/></g>
    <path d="M80 106 C 67 98, 71 82, 80 66 C 82 78, 93 86, 89 97 C 87 102, 84 105, 80 106 Z" fill="url(#flame)"/>
    <path d="M80 104 C 75 99, 77 92, 80 85 C 81 91, 86 95, 84 99 C 83 102, 81 103, 80 104 Z" fill="#fff6d5"/>
    <path d="M70 114 L90 114 L87 106 L73 106 Z" fill="#7a4b14"/>
    <path d="M58 58 C 40 72, 40 100, 58 114 L102 114 C 120 100, 120 72, 102 58 Z" fill="url(#glass)" stroke="rgba(255,236,200,.5)" stroke-width="1.4"/>
    <path d="M53 72 C 49 82, 49 92, 53 102" fill="none" stroke="#fff6e0" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
    <path d="M66 58 C 58 76, 58 96, 66 114" fill="none" stroke="#7a4b14" stroke-width="2.5"/>
    <path d="M94 58 C 102 76, 102 96, 94 114" fill="none" stroke="#7a4b14" stroke-width="2.5"/>
    <path d="M48 114 L112 114 L116 134 C 116 141, 44 141, 44 134 Z" fill="url(#metal)"/>
    <rect x="44" y="132" width="72" height="5" rx="2.5" fill="#7a4b14" opacity=".55"/>
    <path d="M65 122 q4 -4.5 8 0" stroke="#3b1f12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M87 122 q4 -4.5 8 0" stroke="#3b1f12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M73 127 Q 80 134 87 127" stroke="#3b1f12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="59" cy="127" r="3.6" fill="#f4a28c"/><circle cx="101" cy="127" r="3.6" fill="#f4a28c"/>
  </g>

  <!-- the DAG it lights up: brighter near the lantern, fading to the right -->
  <g fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round">
    <path d="M664 508 C 700 508, 712 470, 748 470"/>
    <path d="M664 508 C 700 508, 712 546, 748 546"/>
    <path d="M818 470 C 852 470, 862 508, 896 508"/>
    <path d="M818 546 C 852 546, 862 508, 896 508"/>
    <path d="M966 508 L 1040 508"/>
    <path d="M1110 508 L 1176 508" stroke-dasharray="2 8"/>
  </g>
  <g font-family="Fredoka, sans-serif" font-weight="600" font-size="20" text-anchor="middle">
    <g opacity="1">   <rect x="594" y="490" width="70" height="36" rx="10" fill="#1d2230" stroke="#4ade80" stroke-width="2"/><text x="629" y="515" fill="#4ade80">✓</text></g>
    <g opacity=".95"> <rect x="748" y="452" width="70" height="36" rx="10" fill="#1d2230" stroke="#4ade80" stroke-width="2"/><text x="783" y="477" fill="#4ade80">✓</text></g>
    <g opacity=".95"> <rect x="748" y="528" width="70" height="36" rx="10" fill="#1d2230" stroke="#fbbf24" stroke-width="2"/><text x="783" y="553" fill="#fbbf24">!</text></g>
    <g opacity=".8">  <rect x="896" y="490" width="70" height="36" rx="10" fill="#1d2230" stroke="#4ade80" stroke-width="2"/><text x="931" y="515" fill="#4ade80">✓</text></g>
    <g opacity=".6">  <rect x="1040" y="490" width="70" height="36" rx="10" fill="#1d2230" stroke="#4ade80" stroke-width="2"/><text x="1075" y="515" fill="#4ade80">✓</text></g>
  </g>

  <!-- fireflies -->
  <g fill="#ffd77a">
    <circle cx="520" cy="140" r="2.2" opacity=".7"/><circle cx="1180" cy="90" r="1.8" opacity=".4"/>
    <circle cx="110" cy="420" r="2" opacity=".5"/><circle cx="560" cy="380" r="1.6" opacity=".5"/>
    <circle cx="1220" cy="300" r="1.6" opacity=".35"/><circle cx="70" cy="140" r="1.6" opacity=".35"/>
  </g>
</svg>

<div class="text">
  <h1>Dagwick</h1>
  <p class="tag">The wick that keeps your Airflow DAGs lit.</p>
  <p class="sub">Grades every DAG <b>A–F</b> · shows the fix · <b>pip install dagwick</b></p>
</div>
</body>
</html>
