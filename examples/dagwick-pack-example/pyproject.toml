# An example Dagwick check pack. Not published: copy this folder to start your own.
[project]
name = "dagwick-pack-example"
version = "0.1.0"
description = "Example Dagwick check pack: DAGs carry a team tag."
requires-python = ">=3.10"
# The pack runs inside an Airflow environment that already has Dagwick installed.
dependencies = ["dagwick>=0.2"]

# The one line that makes this a check pack: Dagwick imports this module at
# start-up, and every @check in it is registered next to the built-in checks.
[project.entry-points."dagwick.checks"]
example = "dagwick_pack_example.checks"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagwick_pack_example"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
