name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Lint
        run: uvx ruff check && uvx ruff format --check

      - name: Test (coverage >= 70 %)
        run: uv run --locked pytest -q

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI bundle matches its source
        run: |
          npm ci --prefix ui --no-audit --no-fund
          npm run build --prefix ui
          git diff --exit-code -- src/dagwick/static/

      - name: Package builds with the UI and no runtime dependencies
        run: |
          uv build -q
          unzip -l dist/*.whl | grep -q dagwick/static/dagwick.js
          ! unzip -p dist/*.whl '*/METADATA' | grep -q '^Requires-Dist'
