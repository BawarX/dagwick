name: False alarm
description: A check gives the wrong result for a DAG.
title: "False alarm: <check id> on <short description>"
labels: ["false alarm"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste real DAG code, names, data, connection ids,
        variables or secrets.** Write a minimal DAG from scratch that shows the same problem.
  - type: input
    id: check
    attributes:
      label: Check id
      description: For example `retries`, from the Dagwick tab or `dagwick check --json`.
    validations:
      required: true
  - type: dropdown
    id: got
    attributes:
      label: Dagwick says
      options: [fail, warn, pass]
    validations:
      required: true
  - type: dropdown
    id: expected
    attributes:
      label: It should say
      options: [pass, warn, fail, skip]
    validations:
      required: true
  - type: textarea
    id: dag
    attributes:
      label: Minimal DAG
      description: The smallest DAG file that reproduces it. `dagwick check this_file.py` should show the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: What the check misses, and how many DAGs in your deployment it affects (a rough number).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Airflow 3.3.2, Dagwick 0.2.0
    validations:
      required: true
